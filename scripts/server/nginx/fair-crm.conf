# FAIR CRM nginx site — rendered by bootstrap-server.sh
# Placeholders: __FAIR_CRM_DIR__

map $http_upgrade $fair_stand_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name fuar.kyrox.studio;

    root __FAIR_CRM_DIR__/frontend/dist;
    index index.html;

    # Database backup/restore uploads can be substantially larger than the
    # nginx default. Keep this above the application restore upload ceiling.
    client_max_body_size 256m;

    # Live tab-share signaling only. Video stays on the WebRTC peer and does not
    # pass through this proxy. Heartbeats every 20s stay inside the 120s read timeout.
    location ^~ /api/v1/fair-stand/live-shares {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fair_stand_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ^~ /api/v1/fair-stand/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /kyrox-core/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite output: the file name carries a content hash; keep it for a year.
    # No "always": a 404 for a missing hash must not be cached for a year.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA entry: revalidate on every visit so a new deploy shows at once.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Fair Stand models: fixed names, revalidated with ETag (304 when unchanged).
    location ^~ /models/ {
        types {
            model/gltf-binary glb;
            model/gltf+json gltf;
            text/plain txt;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Fair Stand textures: fixed names, revalidated with ETag (304 when unchanged).
    location ^~ /textures/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
