name: Development Standard Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".kyrox/**"
      - ".cursor/**"
      - "scripts/**"
      - ".github/workflows/development-standard.yml"
  # Merge sonrası main'de tekrar koşu yok: main zorunlu kontrol + strict kuralıyla korunur
  # (kyrox-platform standards/quality/QUALITY_GATE_STANDARD.md §12, PR-only checks).

concurrency:
  group: development-standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-contract:
    name: Feature Contract / Applicability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate schema JSON
        run: python -m json.tool .kyrox/feature-contract.schema.json > /dev/null

      - name: Smoke test scheduled backend-only profile
        run: |
          python scripts/new_feature_contract.py ci-scheduled-smoke \
            --type scheduled_job \
            --tenant-scope organization \
            --trigger scheduled \
            --path backend/app/modules/ci_scheduled_smoke/** \
            --no-frontend \
            --output .kyrox/ci-smoke/ci-scheduled-smoke.json

      - name: Smoke test Super Admin system UI profile
        run: |
          python scripts/new_feature_contract.py ci-system-smoke \
            --type system_admin \
            --tenant-scope system \
            --trigger user \
            --path backend/app/modules/ci_system_smoke/** \
            --path frontend/src/pages/CiSystemSmokePage.tsx \
            --permission fair_crm.admin.ci_smoke.read:read:system:false \
            --route /admin/system/ci-smoke \
            --menu \
            --menu-permission fair_crm.admin.ci_smoke.read \
            --frontend \
            --output .kyrox/ci-smoke/ci-system-smoke.json

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          BASE=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              BASE="$(git rev-parse HEAD^)"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Development standard gate
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.base }}"
          if [[ -n "$BASE" ]]; then
            python scripts/validate_feature_contracts.py --base "$BASE" --head "$GITHUB_SHA"
          else
            python scripts/validate_feature_contracts.py --contracts-only
          fi

  system-behavior-map:
    name: System Behavior Map / Zero New Findings
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate behavior-map schema JSON
        run: python -m json.tool .kyrox/system-behavior-map.schema.json > /dev/null

      - name: Run behavior-map extractor tests
        run: python scripts/maintenance/test_system_behavior_inventory.py

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          BASE=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              BASE="$(git rev-parse HEAD^)"
            fi
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Generate current system behavior inventory
        run: |
          python scripts/maintenance/inventory_system_behavior.py \
            --output /tmp/system-behavior-current.json \
            --markdown /tmp/SYSTEM_BEHAVIOR_CURRENT.md

      - name: Generate comparison-base system behavior inventory
        if: steps.base.outputs.base != ''
        shell: bash
        run: |
          BASE="${{ steps.base.outputs.base }}"
          git worktree add --detach /tmp/fair-crm-system-base "$BASE"
          python scripts/maintenance/inventory_system_behavior.py \
            --root /tmp/fair-crm-system-base \
            --output /tmp/system-behavior-base.json

      - name: Enforce zero new system behavior findings
        if: steps.base.outputs.base != ''
        run: |
          python scripts/maintenance/compare_system_behavior_inventory.py \
            --base /tmp/system-behavior-base.json \
            --current /tmp/system-behavior-current.json

      - name: Report inventory-only mode
        if: steps.base.outputs.base == ''
        run: echo "System behavior inventory generated without a comparison base; no historical finding is promoted to PASS."

      - name: Upload system behavior diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-behavior-${{ github.run_id }}
          path: |
            /tmp/system-behavior-current.json
            /tmp/system-behavior-base.json
            /tmp/SYSTEM_BEHAVIOR_CURRENT.md
          if-no-files-found: warn
          retention-days: 7

  frontend-quality:
    name: Frontend Tests / Build / UI Governance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend applicability
        id: scope
        shell: bash
        run: |
          RUN_FRONTEND=false
          BASE=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            fi
          fi
          if [[ -z "$BASE" ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RUN_FRONTEND=true
          elif [[ -n "$BASE" ]]; then
            if ! git diff --quiet "$BASE...$GITHUB_SHA" -- frontend scripts/maintenance/inventory_frontend_ui.py scripts/maintenance/compare_frontend_ui_inventory.py .github/workflows/development-standard.yml; then
              RUN_FRONTEND=true
            fi
          else
            RUN_FRONTEND=true
          fi
          echo "run=$RUN_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
        run: npm test

      - name: Build frontend
        if: steps.scope.outputs.run == 'true'
        working-directory: frontend
        run: npm run build

      - name: Set up Python for UI governance
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate current UI governance inventory
        if: steps.scope.outputs.run == 'true'
        run: python scripts/maintenance/inventory_frontend_ui.py --report-dir /tmp/ui-current --quiet

      - name: Generate comparison-base UI governance inventory
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.base != ''
        shell: bash
        run: |
          BASE="${{ steps.scope.outputs.base }}"
          git worktree add --detach /tmp/fair-crm-ui-base "$BASE"
          python /tmp/fair-crm-ui-base/scripts/maintenance/inventory_frontend_ui.py --report-dir /tmp/ui-base --quiet

      - name: Enforce zero new UI governance violations
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.base != ''
        run: |
          python scripts/maintenance/compare_frontend_ui_inventory.py \
            --base /tmp/ui-base/inventory.json \
            --current /tmp/ui-current/inventory.json

      - name: Enforce full UI governance without comparison base
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.base == ''
        run: python scripts/maintenance/inventory_frontend_ui.py --gate ALL

      - name: Report frontend N/A
        if: steps.scope.outputs.run != 'true'
        run: echo "Frontend quality is N/A for this diff; no frontend/UI files changed."

  backend-quality:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend applicability
        id: scope
        shell: bash
        run: |
          RUN_BACKEND=false
          BASE=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -n "$BEFORE" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              BASE="$BEFORE"
            fi
          fi
          if [[ -z "$BASE" ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RUN_BACKEND=true
          elif [[ -n "$BASE" ]]; then
            if ! git diff --quiet "$BASE...$GITHUB_SHA" -- \
              backend \
              .kyrox/backend-test-baseline.json \
              scripts/backend_test_baseline.py \
              scripts/quality_check.py \
              .github/workflows/development-standard.yml; then
              RUN_BACKEND=true
            fi
          else
            RUN_BACKEND=true
          fi
          echo "run=$RUN_BACKEND" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Enforce monotonic backend test baseline
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          BASE="${{ steps.scope.outputs.base }}"
          if [[ -n "$BASE" ]]; then
            python scripts/backend_test_baseline.py --base "$BASE"
          else
            python scripts/backend_test_baseline.py
          fi

      - name: Install backend dependencies
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend quality check
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/quality_check.py 2>&1 | tee backend-quality.log

      - name: Upload backend quality diagnostics
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-${{ github.run_id }}
          path: |
            backend-quality.log
            .kyrox/backend-test-baseline.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report backend N/A
        if: steps.scope.outputs.run != 'true'
        run: echo "Backend quality is N/A for this diff; no backend files changed."
